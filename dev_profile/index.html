<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-card">

        <div class="profile-image">
            <span>DEV</span>
        </div>

        <h1>Alex Developer</h1>

        <p class="role">Frontend Developer</p>

        <p class="description">
            Passionate developer who enjoys building clean,
            responsive and user-friendly web applications.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Python</span>
        </div>

        <div class="buttons">
            <a href="#" class="btn primary">View Projects</a>
            <a href="#" class="btn secondary">Contact</a>
        </div>

        <div class="socials">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
            <a href="#">Portfolio</a>
        </div>

    </div>

</body>
</html>
