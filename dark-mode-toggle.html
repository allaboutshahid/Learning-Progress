<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Toggle</title>
  <style>
    body {
      font-family: sans-serif;
      transition: background 0.3s, color 0.3s;
      padding: 2rem;
    }
    body.dark {
      background: #121212;
      color: #f1f1f1;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Dark Mode Demo</h1>
  <button onclick="document.body.classList.toggle('dark')">
    Toggle Theme
  </button>
</body>
</html>
